# Cloudflare Tunnel -> http://textlinkeditor-origin:8080 on hometrader_default.
# No public host listener. HTTPS terminates at Cloudflare.
limit_req_zone $binary_remote_addr zone=textlinkeditor_checks:10m rate=5r/s;
server {
    listen 8080;
    server_name textlinkeditor.skyprawngo.com;
    client_max_body_size 4k;
    access_log off;
    location = /v1/check {
        limit_req zone=textlinkeditor_checks burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://updates:8787;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://updates:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
